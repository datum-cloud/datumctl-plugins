# Notices when a plugin's upstream repo has published a newer release than this
# catalog offers, and opens the PR to catch up.
#
# A plugin's own repo is supposed to push its release here. When that push
# breaks the catalog goes quietly stale and people install an old client. This
# runs regardless of why the push did not happen.
#
# The work is in scripts/scan-upstream-releases.py so it can be read, reviewed
# and run by hand.
name: Scan upstream releases

on:
  schedule:
    # Daily, early UTC. Nothing here is urgent enough to run more often.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what is behind without opening PRs"
        type: boolean
        default: false
      plugin:
        description: "Only this plugin (leave empty for all)"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Scan for newer releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/scan-upstream-releases.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.plugin && format('--plugin {0}', inputs.plugin) || '' }}
