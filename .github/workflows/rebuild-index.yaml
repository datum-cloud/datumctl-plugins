name: Rebuild index

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    uses: datum-cloud/actions/.github/workflows/plugin-catalog-index.yaml@v1.27.1
    secrets:
      app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
      app-private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
