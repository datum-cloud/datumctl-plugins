name: Validate plugin manifests

on:
  pull_request:
    branches: [main]
    paths:
      - "plugins/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Find changed plugin manifests
        id: changed
        run: |
          files=$(git diff --name-only origin/main...HEAD -- plugins/ | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Convert YAML manifests to JSON and validate schema
        run: |
          for f in ${{ steps.changed.outputs.files }}; do
            echo "Validating schema: $f"
            python3 -c "
          import sys, json, yaml
          with open('$f') as fh:
              data = yaml.safe_load(fh)
          print(json.dumps(data))
          " > /tmp/manifest.json
            ajv validate -s schema/plugin-v1alpha1.json -d /tmp/manifest.json --spec=draft7
          done

      - name: Check URIs resolve and verify SHA256
        run: |
          for f in ${{ steps.changed.outputs.files }}; do
            echo "Checking URIs in: $f"
            python3 - <<'EOF'
          import sys, yaml, urllib.request, hashlib

          with open("$f") as fh:
              manifest = yaml.safe_load(fh)

          for platform in manifest["spec"]["platforms"]:
              uri = platform["uri"]
              expected_sha = platform["sha256"]
              print(f"  Checking {uri}")

              req = urllib.request.Request(uri, method="HEAD")
              with urllib.request.urlopen(req) as resp:
                  if resp.status != 200:
                      print(f"  ERROR: {uri} returned {resp.status}", file=sys.stderr)
                      sys.exit(1)

              print(f"  Downloading and verifying SHA256...")
              with urllib.request.urlopen(uri) as resp:
                  data = resp.read()
              actual_sha = hashlib.sha256(data).hexdigest()
              if actual_sha != expected_sha:
                  print(f"  ERROR: SHA256 mismatch for {uri}", file=sys.stderr)
                  print(f"    expected: {expected_sha}", file=sys.stderr)
                  print(f"    actual:   {actual_sha}", file=sys.stderr)
                  sys.exit(1)
              print(f"  OK: {actual_sha}")
          EOF
          done
